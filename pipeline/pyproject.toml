[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strabismus-screen"
version = "0.1.0"
description = "Event-aligned video pipeline for horizontal strabismus screening research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "mediapipe>=0.10.21",
  "numpy>=2.0,<3",
  "opencv-python>=4.10",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
native = ["catboost>=1.2.8"]

[project.scripts]
strabismus-screen = "strabismus_screen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
